{% extends "base.html" %}
{% block content %}
<h1>修改密码</h1>
<section class="card"><h2>修改登录密码</h2>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/admin/change-password" class="form-grid">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label>当前密码<input name="current_password" type="password" required></label>
<label>新密码<input name="new_password" type="password" minlength="1" required></label>
<button>确认修改</button>
</form>
</section>
{% endblock %}
