{% extends "base.html" %}
{% block content %}
<style>
.cfg-card {
  border: 1px solid #d9d9d9;
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 16px;
  background: #fff;
}
.cfg-card h3 { margin: 0 0 16px; font-size: 18px; color: #333; }
.cfg-card label { display: block; margin: 12px 0 4px; font-weight: 600; color: #444; }
.cfg-card input[type="text"], .cfg-card input[type="password"] {
  width: 100%; max-width: 460px; padding: 10px 12px;
  border: 1px solid #d0d0d0; border-radius: 8px; font-size: 14px; box-sizing: border-box;
}
.cfg-card textarea {
  width: 100%; max-width: 640px; padding: 10px 12px; min-height: 120px;
  border: 1px solid #d0d0d0; border-radius: 8px; font-size: 12px;
  font-family: monospace; box-sizing: border-box;
}
.cfg-card .hint { color: #999; font-size: 12px; margin-top: 4px; }
.cfg-card .status { color: #1976d2; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
.cfg-card .btn-submit {
  background: #1976d2; color: #fff; border: none; padding: 12px 32px;
  border-radius: 8px; cursor: pointer; font-size: 15px; margin-top: 20px;
}
</style>

<h1>第三方配置</h1>
<div class="cfg-card">
  <h3>微信支付</h3>
  {% if settings.wechat_pay_configured %}<p class="status">✓ 微信支付已配置</p>
  {% else %}<p class="status">未配置微信支付（扫码购买将不可用）</p>{% endif %}
  <form method="post" action="/admin/settings">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>商户号（MchID）</label>
    <input name="wechat_mchid" type="text" value="{{ settings.wechat_mchid }}">
    <label>AppID</label>
    <input name="wechat_appid" type="text" value="{{ settings.wechat_appid }}">
    <label>APIv3 密钥</label>
    <input name="wechat_apiv3_key" type="password" placeholder="{{ '已配置（留空保持不变）' if settings.wechat_apiv3_key_configured else '输入 32 位 APIv3 密钥' }}">
    <div class="hint">密钥不回显，留空则保持不变</div>
    <label>商户证书序列号</label>
    <input name="wechat_serial_no" type="text" value="{{ settings.wechat_serial_no }}">
    <label>商户私钥（PEM 全文）</label>
    <textarea name="wechat_private_key" placeholder="{{ '已配置（留空保持不变）' if settings.wechat_private_key_configured else '粘贴 -----BEGIN PRIVATE KEY----- 全文' }}"></textarea>
    <label>微信支付平台公钥（PEM 全文）</label>
    <textarea name="wechat_platform_cert" placeholder="{{ '已配置（留空保持不变）' if settings.wechat_platform_cert_configured else '粘贴 -----BEGIN PUBLIC KEY----- 全文' }}"></textarea>
    <label>支付回调 URL</label>
    <input name="wechat_notify_url" type="text" value="{{ settings.wechat_notify_url }}">
    <div class="hint">必须为 HTTPS，如 https://imgtrans.rchtop.top/v1/payments/notify</div>
    <button type="submit" class="btn-submit">保存配置</button>
  </form>
</div>
{% endblock %}
