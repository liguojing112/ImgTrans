{% extends "base.html" %}
{% block content %}
<h1>编辑子账号</h1>
<section class="card">
  <h2>{{ user.username }}</h2>
  <p class="muted">编辑权限、重置密码或删除该账号。</p>

  <form method="post" action="/admin/users/{{ user.user_id }}/permissions" class="form-grid">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <fieldset><legend>权限（可勾选多个）</legend>
    <div class="permission-grid">
    {% for key, label in permission_labels.items() %}<label class="permission-option"><span>{{ label }}</span><input type="checkbox" name="perm_{{ key }}" value="true" {{ "checked" if key in user.permissions }}></label>{% endfor %}
    </div>
    </fieldset>
    <button>保存权限</button>
  </form>

  <form method="post" action="/admin/users/{{ user.user_id }}/reset-password" class="form-grid">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>新密码<input name="password" type="password" minlength="1" required></label>
    <button>重置密码</button>
  </form>

  <form method="post" action="/admin/users/{{ user.user_id }}/delete" data-confirm="删除子账号后不可恢复，确定删除？">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button class="btn-delete">删除该账号</button>
  </form>

  <p><a href="/admin/users">← 返回账号管理</a></p>
</section>
{% endblock %}
