{% extends "base.html" %}
{% block content %}
<h1>管理概览</h1>
<div class="grid">
  {% for label, value in settings %}
  <section class="card"><strong>{{ label }}</strong><p>{% if value is boolean %}{{ "是" if value else "否" }}{% else %}{{ value }}{% endif %}</p></section>
  {% endfor %}
</div>
{% endblock %}
