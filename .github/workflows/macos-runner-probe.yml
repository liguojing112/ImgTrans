name: macOS runner probe

# 临时诊断：确认本仓库能启动哪些 macOS runner 标签。
# 用法：Actions 页面手动触发，或 gh workflow run macos-runner-probe.yml

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-13
          - macos-14
          - macos-15
          - macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Report runner
        run: |
          echo "requested=${{ matrix.runner }}"
          uname -a
          sysctl -n machdep.cpu.brand_string || true
          python3 --version || true
