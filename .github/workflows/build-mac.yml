name: Build macOS (Apple Silicon)

on:
  workflow_dispatch:          # 仓库页面 Actions → 手动触发
  push:
    branches: [feature/desktop-client-v1]

jobs:
  build:
    runs-on: macos-14         # Apple Silicon（arm64）。勿用 macos-13/macos-latest（Intel）
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[release]'

      - name: Download bundled models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/models
          # 完整模型包（Windows 打包上传，含 LAMA + 全部 rapidocr onnx）
          if ! gh release download models --pattern "bundled_models.zip" --dir /tmp/models 2>/dev/null; then
            echo "❌ 请先上传 bundled_models.zip 到 models release："
            echo "   gh release upload models bundled_models.zip"
            exit 1
          fi
          rm -rf packaging/bundled_models
          mkdir -p packaging/bundled_models
          python -c "import zipfile; zipfile.ZipFile('/tmp/models/bundled_models.zip').extractall('packaging/bundled_models')"
          find packaging/bundled_models -type f | wc -l

      - name: Build .app
        run: |
          IMGTRANS_BUILD_TARGET=macos-arm64 python scripts/build_desktop.py --target macos-arm64

      - name: Create dmg
        run: |
          mkdir -p dist/installer
          ditto dist/release-candidate/macos-arm64/ImgTrans.app /tmp/ImgTrans-staging.app
          hdiutil create -volname "优译图AI" \
            -srcfolder /tmp/ImgTrans-staging.app \
            -ov -format UDZO dist/installer/ImgTrans-macos-arm64.dmg
          rm -rf /tmp/ImgTrans-staging.app

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImgTrans-macos-arm64
          path: dist/installer/ImgTrans-macos-arm64.dmg
