name: Build macOS (Apple Silicon)

on:
  workflow_dispatch:          # 仓库页面 Actions → 手动触发
  push:
    branches: [feature/desktop-client-v1]

jobs:
  build:
    runs-on: macos-14         # Apple Silicon（arm64）。勿用 macos-13/macos-latest（Intel）
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[release]'

      - name: Download LAMA model from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/lama
          # 需先手动上传 inpainting_lama_2025jan.onnx 到 GitHub Release（tag 任意）
          if ! gh release download --pattern "inpainting_lama_2025jan.onnx" --dir /tmp/lama 2>/dev/null; then
            echo "❌ 未找到 LAMA 模型资产。请先运行："
            echo "   gh release create models inpainting_lama_2025jan.onnx"
            echo "   （把项目 packaging/bundled_models/lama-inpainting/inpainting_lama_2025jan.onnx 上传）"
            exit 1
          fi
          ls -lh /tmp/lama/

      - name: Prepare bundled models
        run: |
          python scripts/prepare_bundled_models.py --lama-model /tmp/lama/inpainting_lama_2025jan.onnx

      - name: Build .app
        run: |
          IMGTRANS_BUILD_TARGET=macos-arm64 python scripts/build_desktop.py --target macos-arm64

      - name: Create dmg
        run: |
          mkdir -p dist/installer
          hdiutil create -volname "优译图AI" \
            -srcfolder dist/release-candidate/macos-arm64/ImgTrans.app \
            -ov -format UDZO dist/installer/ImgTrans-macos-arm64.dmg

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImgTrans-macos-arm64
          path: dist/installer/ImgTrans-macos-arm64.dmg
